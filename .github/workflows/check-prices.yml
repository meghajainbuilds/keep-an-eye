name: Daily price check
on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check saved products
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Daily price check is not configured yet. Set APP_URL and CRON_SECRET repository secrets after deployment."
            exit 0
          fi
          curl --fail --show-error --silent --max-time 240 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/check-prices"
