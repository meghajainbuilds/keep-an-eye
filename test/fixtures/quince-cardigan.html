<meta property="og:description" content="Crafted with our most exquisite heirloom-quality cashmere, the Luxe Baby Cashmere Cable Cardigan offers an unparalleled luxury experience. Our baby cashmere yarn features a 14.5-14.9 micron fiber thickness that is even finer than our Grade A cashmere, making it even softer and more premium. Each fiber is meticulously combed from young cashmere goats under one year old during their natural moulting season. This careful process results in the softest, most precious and delicate cashmere. Its elegant cable-knit design looks gorgeous over a silk blouse or buttoned up for a cozy-chic style." data-next-head=""/>
