name: Security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-private.mjs --staged
      - name: Scan secrets
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact .
      - name: Audit renderer dependencies
        run: npm audit --prefix renderer --audit-level=low
      - name: Scan application code
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          python -m pip install semgrep==1.178.0
          semgrep scan --config p/nodejs --config p/javascript --metrics off --error --exclude node_modules --exclude renderer/node_modules .
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix renderer --ignore-scripts
      - run: cd renderer && npx playwright install --with-deps chromium
      - name: Allow Chromium to create its sandbox on the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify rendered product and private-network rejection
        env:
          RUN_RENDERER_TESTS: '1'
        run: node --test renderer/test/browser.test.mjs
